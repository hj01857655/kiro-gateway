[package]
name = "kiro-gateway"
version = "0.3.5"
description = "Kiro Gateway Desktop Application"
authors = ["kiro-gateway"]
edition = "2021"

[[bin]]
name = "kiro-gateway"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri 依赖
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
notify = "6.1"

# 后端 Axum 依赖
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bytes = "1"
async-stream = "0.3"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
parking_lot = "0.12"
once_cell = "1.20"
rand = "0.8"
dirs = "5.0"
serde_cbor = "0.11"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
urlencoding = "2.1"
regex = "1.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release 优化配置（防反编译）
[profile.release]
# 优化级别：z = 优化二进制大小（同时增加混淆）
opt-level = "z"
# 链接时优化（LTO）：增加编译时间，但提高优化和混淆
lto = true
# 代码生成单元：1 = 最大优化（但编译慢）
codegen-units = 1
# 移除符号信息：减小体积，增加逆向难度
strip = "symbols"
# Panic 处理：abort = 更小的二进制，移除 unwinding 代码
panic = "abort"
