<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- K 字母设计 -->
  <g transform="translate(256, 256)">
    <!-- 主竖线 -->
    <rect x="-80" y="-140" width="40" height="280" rx="20" fill="url(#iconGradient)"/>
    
    <!-- 上斜线 -->
    <rect x="-40" y="-60" width="140" height="40" rx="20" 
          transform="rotate(-35 -40 -40)" fill="url(#iconGradient)"/>
    
    <!-- 下斜线 -->
    <rect x="-40" y="20" width="140" height="40" rx="20" 
          transform="rotate(35 -40 40)" fill="url(#iconGradient)"/>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="420" cy="92" r="20" fill="#fbbf24" opacity="0.8"/>
  <circle cx="92" cy="420" r="16" fill="#34d399" opacity="0.8"/>
  <circle cx="420" cy="420" r="12" fill="#60a5fa" opacity="0.8"/>
</svg>
