name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    name: Build for ${{ matrix.platform }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ secrets.SOURCE_BRANCH }}
          token: ${{ secrets.DEV_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiro Gateway ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: npm run tauri

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    name: Update README with version
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Update README version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          
          # 更新 Windows 下载链接
          sed -i "s|Kiro\.Gateway_[0-9.]*_x64_zh-CN\.msi|Kiro.Gateway_${VERSION_NUM}_x64_zh-CN.msi|g" README.md
          
          # 更新 macOS Intel 下载链接
          sed -i "s|Kiro\.Gateway_[0-9.]*_x64\.dmg|Kiro.Gateway_${VERSION_NUM}_x64.dmg|g" README.md
          
          # 更新 macOS Apple Silicon 下载链接
          sed -i "s|Kiro\.Gateway_[0-9.]*_aarch64\.dmg|Kiro.Gateway_${VERSION_NUM}_aarch64.dmg|g" README.md
          
          # 更新 Linux AppImage 下载链接
          sed -i "s|Kiro\.Gateway_[0-9.]*_amd64\.AppImage|Kiro.Gateway_${VERSION_NUM}_amd64.AppImage|g" README.md
          
          # 更新 Linux deb 下载链接
          sed -i "s|Kiro\.Gateway_[0-9.]*_amd64\.deb|Kiro.Gateway_${VERSION_NUM}_amd64.deb|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: 自动更新 README 版本号到 ${{ github.ref_name }}"
          git push
