name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ secrets.SOURCE_BRANCH }}
          token: ${{ secrets.DEV_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiro Gateway ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
        continue-on-error: true

      - name: Upload build artifacts (if build succeeded)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/

  create-release-info:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create latest.json
        run: |
          cat > latest.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "notes": "See the release notes for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/kiro-gateway_x64-setup.msi.zip"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/kiro-gateway_amd64.AppImage.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/kiro-gateway_x64.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/kiro-gateway_aarch64.app.tar.gz"
              }
            }
          }
          EOF

      - name: Upload latest.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json
