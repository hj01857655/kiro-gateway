name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust build optimization
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - uses: tauri-apps/tauri-action@v0.5.14
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'kiro-gateway v__VERSION__'
          releaseBody: |
            ## 🎉 kiro-gateway v__VERSION__
            
            Kiro API 网关 - OpenAI/Anthropic 兼容接口
            
            ### 📦 下载安装
            
            - **Windows**: `kiro-gateway_*_x64-setup.msi`
            - **macOS (Apple Silicon)**: `kiro-gateway_*_aarch64.dmg`
            - **macOS (Intel)**: `kiro-gateway_*_x64.dmg`
            - **Linux**: `kiro-gateway_*_amd64.deb` 或 `.AppImage`
            
            ### ✨ 主要功能
            
            - ✅ OpenAI Chat Completions API 完全兼容
            - ✅ Anthropic Messages API 完全兼容
            - ✅ 多账号管理和自动轮询
            - ✅ Token 自动刷新（Social/IDC）
            - ✅ 流式响应和工具调用支持
            - ✅ 图形化管理界面
            - ✅ 日志查看和统计监控
            
            ### 📝 更新日志
            
            查看完整更新日志：[CHANGELOG](https://github.com/hj01857655/kiro-gateway/commits/${{ github.ref_name }})
            
            ### 🔧 使用说明
            
            1. 下载对应平台的安装包
            2. 安装后启动应用
            3. 添加 Kiro 账号（支持从 Kiro IDE 导入）
            4. 使用 `http://127.0.0.1:8080` 作为 API 端点
            
            ### 📚 文档
            
            - [快速开始](https://github.com/hj01857655/kiro-gateway#readme)
            - [配置说明](https://github.com/hj01857655/kiro-gateway/tree/main/docs)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # 不在矩阵构建中生成 updater 文件，在后续单独生成
          includeUpdaterJson: false

  # 所有平台构建完成后，从 Release 资源生成 latest.json
  generate-updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Release Assets
        run: |
          mkdir -p ./release-assets
          gh release download ${{ github.ref_name }} --dir ./release-assets --pattern "*.sig"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate latest.json
        run: |
          # 获取版本号（去掉 v 前缀）
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          
          # 获取发布日期（RFC 3339 格式）
          PUB_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # 读取签名文件
          WINDOWS_SIG=$(cat ./release-assets/Kiro.Gateway_*_x64-setup.msi.sig 2>/dev/null || echo "")
          LINUX_DEB_SIG=$(cat ./release-assets/Kiro.Gateway_*_amd64.deb.sig 2>/dev/null || echo "")
          LINUX_APPIMAGE_SIG=$(cat ./release-assets/Kiro.Gateway_*_amd64.AppImage.sig 2>/dev/null || echo "")
          MACOS_AARCH64_SIG=$(cat ./release-assets/Kiro.Gateway_*_aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MACOS_X64_SIG=$(cat ./release-assets/Kiro.Gateway_*_x64.app.tar.gz.sig 2>/dev/null || echo "")
          
          # 生成 latest.json
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WINDOWS_SIG",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/Kiro.Gateway_${VERSION}_x64-setup.msi"
              },
              "linux-x86_64": {
                "signature": "$LINUX_DEB_SIG",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/Kiro.Gateway_${VERSION}_amd64.deb"
              },
              "darwin-aarch64": {
                "signature": "$MACOS_AARCH64_SIG",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/Kiro.Gateway_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$MACOS_X64_SIG",
                "url": "https://github.com/hj01857655/kiro-gateway/releases/download/${{ github.ref_name }}/Kiro.Gateway_${VERSION}_x64.app.tar.gz"
              }
            }
          }
          EOF
          
          cat latest.json

      - name: Upload latest.json to Release
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
