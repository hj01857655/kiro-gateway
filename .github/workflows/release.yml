name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust build optimization
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - uses: tauri-apps/tauri-action@v0.5.14
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'kiro-gateway v__VERSION__'
          releaseBody: |
            ## 🎉 kiro-gateway v__VERSION__
            
            Kiro API 网关 - OpenAI/Anthropic 兼容接口
            
            ### 📦 下载安装
            
            - **Windows**: `kiro-gateway_*_x64-setup.exe` 或 `.msi`
            - **macOS (Apple Silicon)**: `kiro-gateway_*_aarch64.dmg`
            - **macOS (Intel)**: `kiro-gateway_*_x64.dmg`
            - **Linux**: `kiro-gateway_*_amd64.deb` 或 `.AppImage`
            
            ### ✨ 主要功能
            
            - ✅ OpenAI Chat Completions API 完全兼容
            - ✅ Anthropic Messages API 完全兼容
            - ✅ 多账号管理和自动轮询
            - ✅ Token 自动刷新（Social/IDC）
            - ✅ 流式响应和工具调用支持
            - ✅ 图形化管理界面
            - ✅ 日志查看和统计监控
            
            ### 📝 更新日志
            
            查看完整更新日志：[CHANGELOG](https://github.com/hj01857655/kiro-gateway/commits/${{ github.ref_name }})
            
            ### 🔧 使用说明
            
            1. 下载对应平台的安装包
            2. 安装后启动应用
            3. 添加 Kiro 账号（支持从 Kiro IDE 导入）
            4. 使用 `http://127.0.0.1:8080` 作为 API 端点
            
            ### 📚 文档
            
            - [快速开始](https://github.com/hj01857655/kiro-gateway#readme)
            - [配置说明](https://github.com/hj01857655/kiro-gateway/tree/main/docs)
            
            ---
            
            **完整源码**: [kiro-gateway_dev](https://github.com/hj01857655/kiro-gateway_dev)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # 在最后一个平台（Windows）生成 updater 文件
          includeUpdaterJson: ${{ matrix.platform == 'windows-latest' }}
